<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>⚡ ピカチュウの大冒険</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background:
        linear-gradient(180deg, #fff7b2 0%, #fffbe0 45%, #ffffff 100%);
      color: #333;
      min-height: 100vh;
    }

    .container {
      width: min(92%, 700px);
      margin: 0 auto;
      padding: 20px 0 50px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      color: #333;
      text-shadow: 2px 2px 0 #ffd83d;
    }

    header p {
      margin: 8px 0 0;
      font-size: 15px;
      font-weight: 700;
      color: #665b20;
    }

    .hero {
      background: #fff;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      border: 3px solid #ffd83d;
      margin-bottom: 18px;
    }

    .hero-title {
      text-align: center;
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .hero-text {
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .primary {
      background: #ffd83d;
      color: #333;
      box-shadow: 0 4px 0 #d8ad00;
    }

    .secondary {
      background: #fff3a3;
      color: #5d4d00;
      box-shadow: 0 4px 0 #e5cf5a;
    }

    .ghost {
      background: #f5f5f5;
      color: #555;
      box-shadow: 0 3px 0 #d5d5d5;
    }

    .danger {
      background: #fff0f0;
      color: #c0392b;
      box-shadow: 0 3px 0 #e4b5b0;
    }

    .card {
      background: #fff;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
    }

    .card-title {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 15px;
    }

    .scanner-help {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.6;
    }

    .progress-summary {
      text-align: center;
      margin-bottom: 14px;
    }

    .progress-number {
      font-size: 30px;
      font-weight: 900;
      color: #e3ad00;
    }

    .progress-bar {
      width: 100%;
      height: 15px;
      background: #eee;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ffd83d;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .question-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
    }

    .question-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 13px;
      background: #f7f7f7;
    }

    .question-row.cleared {
      background: #fff5b8;
    }

    .question-icon {
      font-size: 22px;
      width: 30px;
      text-align: center;
    }

    .question-name {
      flex: 1;
      font-weight: 800;
      font-size: 14px;
    }

    .question-status {
      font-size: 12px;
      font-weight: 800;
      color: #888;
    }

    .question-row.cleared .question-status {
      color: #d09d00;
    }

    .info {
      background: #fff9d8;
      border: 2px dashed #e6c52e;
      border-radius: 15px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.7;
    }

    .info strong {
      color: #a67c00;
    }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(100%, 500px);
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
    }

    .modal h2 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 22px;
    }

    .modal p {
      line-height: 1.7;
      font-size: 14px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .question-setting {
      margin-bottom: 15px;
    }

    .question-setting label {
      display: block;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .question-setting input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 13px;
    }

    .question-setting input:focus {
      outline: none;
      border-color: #ffd83d;
    }

    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    .choice-button {
      background: #fff9d8;
      border: 2px solid #f1d65c;
      box-shadow: none;
      color: #5a4c00;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      z-index: 2000;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 20px;
    }

    @media (min-width: 600px) {
      .actions {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .actions button {
        flex: 1;
        min-width: 200px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>⚡ ピカチュウの大冒険</h1>
      <p>QRを見つけて10問の冒険を進めよう！</p>
    </header>

    <!-- メイン -->
    <section class="hero">
      <div class="hero-title">
        🌟 冒険スタート！
      </div>

      <div class="hero-text">
        家の中にかくされたQRコードを探そう！<br>
        QRコードを見つけたら、カメラで読み取ってね。
      </div>

      <div class="actions">
        <button class="primary" onclick="startScanner()">
          📷 QRコードをよみとる
        </button>

        <button class="secondary" onclick="showQuestionChooser()">
          🔗 問題をひらく
        </button>

        <button class="ghost" onclick="showSettings()">
          ⚙️ 問題設定
        </button>

        <button class="danger" onclick="resetAdventure()">
          🔄 冒険を最初から
        </button>
      </div>
    </section>

    <!-- QRスキャナー -->
    <section class="card" id="scannerCard" style="display:none;">
      <div class="card-title">
        📷 QRコードを読み取ろう
      </div>

      <div id="reader"></div>

      <div class="scanner-help">
        QRコードをカメラの枠内に入れてください。
      </div>

      <div style="margin-top:15px;">
        <button class="ghost" onclick="stopScanner()">
          ✕ カメラを閉じる
        </button>
      </div>
    </section>

    <!-- 進捗 -->
    <section class="card">
      <div class="card-title">
        🗺️ 冒険の進み具合
      </div>

      <div class="progress-summary">
        <div>
          <span class="progress-number" id="clearedCount">0</span>
          <span style="font-weight:900;"> / 10</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="question-list" id="questionList"></div>
    </section>

    <!-- QR説明 -->
    <section class="card">
      <div class="card-title">
        💡 QRコードについて
      </div>

      <div class="info">
        QRコードには、次のようなURLを入れてください。<br><br>

        <strong>
          https://kengosot-creator.github.io/pikachu-adventure/?q=1
        </strong>

        <br><br>

        最後の <strong>?q=1</strong> の数字を
        <strong>1〜10</strong> に変えることで、
        それぞれの問題につながります。
      </div>
    </section>

    <footer>
      ⚡ ピカチュウの大冒険
    </footer>

  </div>


  <!-- モーダル -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- トースト -->
  <div class="toast" id="toast"></div>


  <script>

    const QUESTIONS_KEY = "pikachu_questions_v2";
    const CLEARED_KEY = "pikachu_cleared_v2";

    let scanner = null;
    let scannerRunning = false;

    const DEFAULT_QUESTIONS = Array.from(
      { length: 10 },
      (_, i) => ({
        id: i + 1,
        name: `第${i + 1}問`,
        url: ""
      })
    );


    /* =========================
       問題設定
    ========================= */

    function loadQuestions() {

      try {

        const saved =
          JSON.parse(localStorage.getItem(QUESTIONS_KEY));

        if (
          Array.isArray(saved) &&
          saved.length === 10
        ) {
          return saved;
        }

      } catch (e) {
        console.log(e);
      }

      return DEFAULT_QUESTIONS;
    }


    function saveQuestions(questions) {

      localStorage.setItem(
        QUESTIONS_KEY,
        JSON.stringify(questions)
      );

    }


    /* =========================
       クリア状況
    ========================= */

    function clearedSet() {

      try {

        const saved =
          JSON.parse(localStorage.getItem(CLEARED_KEY));

        if (Array.isArray(saved)) {
          return new Set(saved);
        }

      } catch (e) {
        console.log(e);
      }

      return new Set();
    }


    function markCleared(id) {

      const set = clearedSet();

      set.add(id);

      localStorage.setItem(
        CLEARED_KEY,
        JSON.stringify([...set])
      );

      renderProgress();

    }


    /* =========================
       冒険をリセット
    ========================= */

    function resetAdventure() {

      const cleared = clearedSet();

      if (cleared.size === 0) {

        showToast("まだクリアした問題はありません");

        return;
      }

      const ok = confirm(
        "クリアした問題をすべてリセットして、冒険を最初から始めますか？\n\n問題設定（GoogleフォームのURL）はそのまま残ります。"
      );

      if (!ok) {
        return;
      }

      localStorage.removeItem(CLEARED_KEY);

      renderProgress();

      showToast("🌟 冒険を最初からに戻しました！");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* =========================
       進捗表示
    ========================= */

    function renderProgress() {

      const questions = loadQuestions();
      const cleared = clearedSet();

      const count = cleared.size;

      document.getElementById("clearedCount")
        .textContent = count;

      document.getElementById("progressFill")
        .style.width = `${count / 10 * 100}%`;


      const list =
        document.getElementById("questionList");

      list.innerHTML = "";


      questions.forEach(q => {

        const row =
          document.createElement("div");

        const isCleared =
          cleared.has(q.id);

        row.className =
          "question-row" +
          (isCleared ? " cleared" : "");


        row.innerHTML = `
          <div class="question-icon">
            ${isCleared ? "⭐" : "🔒"}
          </div>

          <div class="question-name">
            ${q.name}
          </div>

          <div class="question-status">
            ${isCleared ? "クリア！" : "未クリア"}
          </div>
        `;

        list.appendChild(row);

      });

    }


    /* =========================
       QRコード
    ========================= */

    function parseQuestionId(text) {

      try {

        const u = new URL(text);

        const p =
          u.searchParams.get("q") ||
          u.searchParams.get("question");

        if (
          p &&
          /^(?:[1-9]|10)$/.test(p)
        ) {
          return Number(p);
        }

      } catch (e) {}

      const m =
        String(text).match(
          /(?:第|Q)\s*(10|[1-9])\s*(?:問)?/i
        );

      return m
        ? Number(m[1])
        : null;
    }


    /* =========================
       スキャナー開始
    ========================= */

    function startScanner() {

      const card =
        document.getElementById("scannerCard");

      card.style.display = "block";

      card.scrollIntoView({
        behavior: "smooth"
      });


      if (scannerRunning) {
        return;
      }


      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        onScanSuccess,

        () => {}

      )
      .then(() => {

        scannerRunning = true;

      })
      .catch(err => {

        console.error(err);

        showModal(
          "📷 カメラを起動できませんでした",
          `
          <p>
            カメラを利用するには、ブラウザのカメラ許可が必要です。
          </p>
          `,
          [
            {
              text: "閉じる",
              className: "ghost",
              action: closeModal
            }
          ]
        );

      });

    }


    /* =========================
       スキャナー停止
    ========================= */

    function stopScanner() {

      if (!scanner || !scannerRunning) {

        document.getElementById("scannerCard")
          .style.display = "none";

        return;
      }


      scanner.stop()
        .then(() => {

          scannerRunning = false;

          document.getElementById("scannerCard")
            .style.display = "none";

        })
        .catch(err => {

          console.log(err);

          scannerRunning = false;

          document.getElementById("scannerCard")
            .style.display = "none";

        });

    }


    /* =========================
       QR読み取り成功
    ========================= */

    function onScanSuccess(decodedText) {

      const id =
        parseQuestionId(decodedText);


      if (!id) {

        showToast(
          "このQRコードは問題QRではありません"
        );

        return;
      }


      stopScanner();

      showQuestion(id);

    }


    /* =========================
       問題表示
    ========================= */

    function showQuestion(id) {

      const questions = loadQuestions();

      const q =
        questions.find(x => x.id === id);


      if (!q) {

        showToast("問題が見つかりません");

        return;
      }


      if (!q.url) {

        showModal(

          `🔒 ${q.name}`,

          `
          <p>
            この問題にはまだ問題ページが設定されていません。
          </p>
          `,

          [
            {
              text: "⚙️ 問題設定",
              className: "primary",
              action: () => {
                closeModal();
                showSettings();
              }
            },
            {
              text: "閉じる",
              className: "ghost",
              action: closeModal
            }
          ]

        );

        return;
      }


      showModal(

        `🔓 ${q.name}`,

        `
        <p>
          問題を見つけたよ！<br>
          Googleフォームの問題に挑戦しよう。
        </p>
        `,

        [
          {
            text: "🔗 問題をひらく",
            className: "primary",
            action: () => openQuestion(q)
          },
          {
            text: "閉じる",
            className: "ghost",
            action: closeModal
          }
        ]

      );

    }


    /* =========================
       問題を開く
    ========================= */

    function openQuestion(q) {

      window.open(
        q.url,
        "_blank"
      );


      showModal(

        `🎉 ${q.name}`,

        `
        <p>
          問題ページを開きました！<br><br>

          問題を解いたら、この画面に戻って<br>
          <strong>「クリア！」</strong>
          を押してください。
        </p>
        `,

        [
          {
            text: "✅ クリア！",
            className: "primary",
            action: () => {

              markCleared(q.id);

              closeModal();

              showToast(
                `${q.name} クリア！`
              );

            }
          },

          {
            text: "あとで",
            className: "ghost",
            action: closeModal
          }
        ]

      );

    }


    /* =========================
       問題選択
    ========================= */

    function showQuestionChooser() {

      const questions =
        loadQuestions();

      let html = `
        <p>
          開きたい問題を選んでください。
        </p>

        <div class="choice-list">
      `;


      questions.forEach(q => {

        html += `
          <button
            class="choice-button"
            onclick="chooseQuestion(${q.id})"
          >
            ${q.id}. ${q.name}
          </button>
        `;

      });


      html += `
        </div>
      `;


      showModal(

        "🔗 問題をひらく",

        html,

        [
          {
            text: "閉じる",
            className: "ghost",
            action: closeModal
          }
        ]

      );

    }


    function chooseQuestion(id) {

      closeModal();

      setTimeout(() => {

        showQuestion(id);

      }, 100);

    }


    /* =========================
       問題設定
    ========================= */

    function showSettings() {

      const questions =
        loadQuestions();


      let html = `
        <p>
          各問題に対応するGoogleフォームのURLを入力してください。
        </p>
      `;


      questions.forEach(q => {

        html += `
          <div class="question-setting">

            <label>
              ${q.name}
            </label>

            <input
              id="question-url-${q.id}"
              type="url"
              placeholder="https://docs.google.com/forms/..."
              value="${escapeHtml(q.url)}"
            >

          </div>
        `;

      });


      showModal(

        "⚙️ 問題設定",

        html,

        [
          {
            text: "💾 保存する",
            className: "primary",
            action: saveSettings
          },

          {
            text: "閉じる",
            className: "ghost",
            action: closeModal
          }
        ]

      );

    }


    function saveSettings() {

      const questions =
        loadQuestions();


      questions.forEach(q => {

        const input =
          document.getElementById(
            `question-url-${q.id}`
          );

        if (input) {
          q.url = input.value.trim();
        }

      });


      saveQuestions(questions);

      closeModal();

      showToast(
        "💾 問題設定を保存しました"
      );

    }


    /* =========================
       HTMLエスケープ
    ========================= */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       モーダル
    ========================= */

    function showModal(
      title,
      body,
      buttons = []
    ) {

      const backdrop =
        document.getElementById(
          "modalBackdrop"
        );

      const content =
        document.getElementById(
          "modalContent"
        );


      let buttonsHtml = "";

      buttons.forEach((button, index) => {

        buttonsHtml += `
          <button
            id="modal-button-${index}"
            class="${button.className || "primary"}"
          >
            ${button.text}
          </button>
        `;

      });


      content.innerHTML = `

        <h2>${title}</h2>

        ${body}

        <div class="modal-actions">
          ${buttonsHtml}
        </div>

      `;


      buttons.forEach((button, index) => {

        const el =
          document.getElementById(
            `modal-button-${index}`
          );

        if (el) {
          el.onclick = button.action;
        }

      });


      backdrop.classList.add("show");

    }


    function closeModal() {

      document
        .getElementById("modalBackdrop")
        .classList.remove("show");

    }


    /* =========================
       トースト
    ========================= */

    let toastTimer = null;


    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");


      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 2500);

    }


    /* =========================
       初期化
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        renderProgress();

      }
    );

  </script>

</body>
</html>
